<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const preference = window.localStorage.getItem('studentHub.theme');
          const valid = ['light', 'dark', 'system'].includes(preference) ? preference : 'system';
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = valid === 'system' ? (systemDark ? 'dark' : 'light') : valid;
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePreference = valid;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.themePreference = 'system';
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172554" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Student Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
